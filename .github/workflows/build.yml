name: Fetch Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  create_release:
    name: Create Release
    runs-on: ubuntu-latest

    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'npm'

      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}

  build:
    name: Fetch Qt Binaries (${{ matrix.target }})
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
            archive: linux
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
            archive: aarch64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
            archive: osx
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            qt_host: mac
            qt_arch: ''
            qt_dir: macos
            archive: darwin-arm64
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
            archive: windows
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_dir: msvc2022_arm64
            archive: win32-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Qt
        if: matrix.qt_arch != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Qt
        if: matrix.qt_arch == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Locate Tmp Dir
        run: |
          QT_TMP0='${{ github.workspace }}'
          QT_TMP1="${QT_TMP0//'\'/"/"}"
          echo "QT_TMP=$QT_TMP1/../__tmp" >> $GITHUB_ENV

      - name: Create Qt Subdirs
        run: |
          chmod +x src/qt-mkdir.sh
          src/qt-mkdir.sh ${{ env.QT_TMP }}

      - name: Copy Qt Dir - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          chmod +x src/qt-copy-linux.sh
          src/qt-copy-linux.sh ${{ env.QT_TMP }} ${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}

      - name: Copy Qt Dir - MacOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          chmod +x src/qt-copy-macos.sh
          src/qt-copy-macos.sh ${{ env.QT_TMP }} ${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}

      - name: Copy Qt Dir - Windows
        if: startsWith(matrix.target, 'windows-')
        run: |
          echo "OS_NAME=${{ matrix.archive }}" >> $GITHUB_ENV
          src/qt-copy-windows.sh '${{ env.QT_TMP }}' '${{ github.workspace }}\..\Qt\6.8.0\${{ matrix.qt_dir }}'

      - name: Pack Libs
        id: pack-files
        run: |
          cd '${{ env.QT_TMP }}'
          PACK_DIR='${{ github.workspace }}'
          PACK_DIR="${PACK_DIR//'\'/"/"}"
          PACK_PATH="$PACK_DIR/${{ env.OS_NAME }}.gz"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar --force-local -czf "$PACK_PATH" *
          else
            tar -czf "$PACK_PATH" *
          fi
          echo "pack=$PACK_PATH" >> $GITHUB_OUTPUT

      - name: Attest Binary
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.pack-files.outputs.pack }}

      - name: Store Binaries
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: ${{ steps.pack-files.outputs.pack }}
