name: Fetch Binaries
defaults:
  run:
    shell: bash

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version to build. Defaults to package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    name: Pack npm Candidate
    runs-on: ubuntu-latest

    steps:

      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'npm'

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Store npm Candidate
        uses: node-3d/addon-tools/actions/npm-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16

  build:
    name: Fetch Qt Binaries (${{ matrix.target }})
    needs: package
    strategy:
      fail-fast: false
      matrix: &native-matrix
        include:
          - target: linux-x64
            os: ubuntu-22.04
            node_arch: x64
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - target: linux-arm64
            os: ubuntu-22.04-arm
            node_arch: arm64
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
          - target: darwin-x64
            os: macos-26-intel
            node_arch: x64
            qt_host: mac
            qt_arch: clang_64
            qt_dir: macos
          - target: darwin-arm64
            os: macos-26
            node_arch: arm64
            qt_host: mac
            qt_arch: ''
            qt_dir: macos
          - target: windows-x64
            os: windows-2022
            node_arch: x64
            qt_host: windows
            qt_arch: win64_msvc2022_64
            qt_dir: msvc2022_64
          - target: windows-arm64
            os: windows-11-arm
            node_arch: arm64
            qt_host: windows_arm64
            qt_arch: win64_msvc2022_arm64
            qt_dir: msvc2022_arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Qt
        if: matrix.qt_arch != ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Qt
        if: matrix.qt_arch == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          host: ${{ matrix.qt_host }}
          target: desktop
          cache: 'true'
          cache-key-prefix: install-qt-${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
          cache: 'npm'

      - name: Print Native Target
        run: |
          echo "runner=$(uname -s)-$(uname -m)"
          node -p "'node=' + process.version + ' platform=' + process.platform + ' arch=' + process.arch"
          npm config get arch

      - name: Install Modules
        run: npm ci --ignore-scripts

      - name: Locate Tmp Dir
        run: |
          QT_TMP0='${{ github.workspace }}'
          QT_TMP1="${QT_TMP0//'\'/"/"}"
          echo "QT_TMP=$QT_TMP1/../__tmp" >> $GITHUB_ENV

      - name: Create Qt Subdirs
        run: |
          chmod +x src/qt-mkdir.sh
          src/qt-mkdir.sh ${{ env.QT_TMP }}

      - name: Copy Qt Dir - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq patchelf
          chmod +x src/qt-copy-linux.sh
          src/qt-copy-linux.sh ${{ env.QT_TMP }} ${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}

      - name: Copy Qt Dir - MacOS
        if: startsWith(matrix.target, 'darwin-')
        run: |
          chmod +x src/qt-copy-macos.sh
          src/qt-copy-macos.sh ${{ env.QT_TMP }} ${{ github.workspace }}/../Qt/6.8.0/${{ matrix.qt_dir }}

      - name: Copy Qt Dir - Windows
        if: startsWith(matrix.target, 'windows-')
        run: |
          src/qt-copy-windows.sh '${{ env.QT_TMP }}' '${{ github.workspace }}\..\Qt\6.8.0\${{ matrix.qt_dir }}'

      - name: Stage Built Binaries
        run: |
          node -e "import('@node-3d/addon-tools').then(async (m) => { const fs = await import('node:fs/promises'); await fs.cp(process.env.QT_TMP, m.getBin(), { recursive: true }); })"

      - name: Verify Qt macOS 13.5 compatibility
        if: startsWith(matrix.target, 'darwin-')
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            versions="$(otool -l "$file" | awk '
              $1 == "cmd" {
                wanted = $2 == "LC_BUILD_VERSION" ? "minos" : ($2 == "LC_VERSION_MIN_MACOSX" ? "version" : "")
              }
              wanted != "" && $1 == wanted { print $2; wanted = "" }
            ')"
            if [ -z "$versions" ]; then
              echo "Missing macOS deployment target: $file" >&2
              exit 1
            fi
            while IFS= read -r version; do
              if ! awk -v version="$version" 'BEGIN {
                split(version, parts, ".")
                exit (parts[1] > 13 || (parts[1] == 13 && parts[2] > 5))
              }'; then
                echo "Qt binary requires macOS $version: $file" >&2
                exit 1
              fi
            done <<< "$versions"
            checked=$((checked + 1))
          done < <(find bin-* -type f \( -name '*.dylib' -o -path '*.framework/Versions/*/*' \) -print0)
          test "$checked" -gt 0
          echo "Verified $checked Qt Mach-O files support macOS 13.5"
      - name: Store Native Candidate
        uses: node-3d/addon-tools/actions/native-candidate-upload@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          artifact-name: native-${{ matrix.target }}

  consumer-tests:
    name: Packed Consumer (${{ matrix.target }})
    needs: [package, build]
    strategy:
      fail-fast: false
      matrix: *native-matrix
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          architecture: ${{ matrix.node_arch }}
      - name: Install Qt GUI runtime - Linux
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq libegl1
      - name: Install Packed Consumer Candidate
        id: consumer
        uses: node-3d/addon-tools/actions/consumer-install@1073c0a6403f6c20df2135f03950a568e865aa16
        with:
          package-name: '@node-3d/deps-qt-gui'
          binary-artifact: native-${{ matrix.target }}
          fixture: test-consumer
      - name: Build Packed Consumer Addon
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm run build
      - name: Run Packed Consumer Tests
        working-directory: ${{ steps.consumer.outputs.directory }}
        run: npm test

  release:
    name: Create Release
    needs: consumer-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Get Package Version
        id: package-version
        run: |
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$release_tag" ]; then
            release_tag="$(node -p "require('./package').version")"
          fi
          echo "version=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Download Native Candidates
        uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: release-candidates
          merge-multiple: true
      - name: Attest Binaries
        uses: actions/attest@v4
        with:
          subject-path: release-candidates/*.gz
      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.package-version.outputs.version }}
          name: Release ${{ steps.package-version.outputs.version }}
          files: release-candidates/*.gz
